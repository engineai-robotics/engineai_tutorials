<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="architecture-title architecture-description">
<title id="architecture-title">PM01 navigation architecture</title>
<desc id="architecture-description">Livox or Gazebo sensor data feeds local odometry and mapping. RViz, CLI, or Python supplies goals. Nav2 generates velocities for the enabled motion adapter and the robot moves to the goal.</desc>
