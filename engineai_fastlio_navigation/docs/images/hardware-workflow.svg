<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1304" viewBox="0 0 960 1304" role="img" aria-labelledby="title desc">
<title id="title">PM01 真机三种模式操作流程</title>
<desc id="desc">准备向导完成构建和镜像加载后加载环境，站稳并选择 fresh 新图导航、mapping 手柄建图或 saved 旧图定位导航。结束时按需保存地图，释放运动输出并确认，最后停止机器人会话。</desc>
<rect width="960" height="1304" fill="#ffffff"/>
<text x="480" y="38" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" fill="#24344a">真机操作流程</text>
<text x="480" y="68" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#64748b">先完成公共准备，再选择一条路线</text>
<rect x="245" y="92" width="470" height="72" rx="14" fill="#f5f8fc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="480.0" y="121.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#24344a">准备向导：构建开发端、加载机载镜像</text>
<text x="480.0" y="149.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#24344a">bash scripts/setup_hardware.sh</text>
<polyline points="480,164 480,188" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
<polygon points="475,180 485,180 480,188" fill="#94a3b8"/>
<rect x="245" y="188" width="470" height="72" rx="14" fill="#f5f8fc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="480.0" y="217.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#24344a">加载本次机器人环境</text>
<text x="480.0" y="245.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#24344a">source ~/.config/pm01_navigation/active.env</text>
<polyline points="480,260 480,283" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
<polygon points="475,275 485,275 480,283" fill="#94a3b8"/>
<polygon points="480,283 650,328 480,373 310,328" fill="#edf3fb" stroke="#a8bdd8" stroke-width="1.5"/>
<text x="480" y="324" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#24344a">站稳并保持静止</text>
<text x="480" y="349" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#52677f">选择一种模式启动</text>
