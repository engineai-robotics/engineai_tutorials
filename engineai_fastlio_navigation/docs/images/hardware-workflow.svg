<text x="170.0" y="489.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#35659e">session start --mode fresh</text>
<rect x="356" y="430" width="248" height="76" rx="14" fill="#ddf2e9" stroke="#88bdaa" stroke-width="1.5"/>
