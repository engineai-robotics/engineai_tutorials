<text x="480" y="1287" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#64748b">所有模式启动时运动输出默认关闭 · 完整命令见下方对应步骤</text>
