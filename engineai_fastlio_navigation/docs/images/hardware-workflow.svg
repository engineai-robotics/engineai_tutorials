<text x="480.0" y="1026.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#24344a">释放运动输出：release-motion</text>
<text x="480.0" y="1054.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#24344a">再用 status 确认输出进程与发布者已退出</text>
<text x="480.0" y="1082.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#24344a">释放会请求取消目标；手柄接管以现场确认为准</text>
<polyline points="480,1091 480,1117" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
<polygon points="475,1109 485,1109 480,1117" fill="#94a3b8"/>
<rect x="245" y="1117" width="470" height="72" rx="14" fill="#f5f8fc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="480.0" y="1146.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#24344a">停止机载会话：session stop</text>
<text x="480.0" y="1174.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#24344a">在机器人 SSH 终端执行</text>
<polyline points="480,1189 480,1213" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
<polygon points="475,1205 485,1205 480,1213" fill="#94a3b8"/>
