<rect x="46" y="532" width="248" height="100" rx="14" fill="#f5f8fc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="170.0" y="561.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#24344a">打开 RViz</text>
<text x="170.0" y="589.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#24344a">确认新地图与机器人位姿</text>
<text x="170.0" y="617.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#24344a">以本次启动位置为原点</text>
<rect x="356" y="532" width="248" height="100" rx="14" fill="#f5f8fc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="480.0" y="561.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#24344a">打开 RViz</text>
<text x="480.0" y="589.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#24344a">确认地图持续更新</text>
<text x="480.0" y="617.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#24344a">使用现有实体手柄</text>
<rect x="666" y="532" width="248" height="100" rx="14" fill="#f5f8fc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="790.0" y="561.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="600" fill="#24344a">打开 RViz 查看旧图</text>
<text x="790.0" y="589.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#24344a">2D Pose Estimate</text>
<text x="790.0" y="617.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#24344a">指定当前位置与朝向</text>
