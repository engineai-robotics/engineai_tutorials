<polygon points="475,885 485,885 480,893" fill="#94a3b8"/>
<rect x="245" y="893" width="470" height="84" rx="14" fill="#f5f8fc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="480.0" y="928.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#24344a">按需保存地图：save-map</text>
<text x="480.0" y="956.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#24344a">停止后台前完成；记下机器人上的 map.yaml 路径</text>
<polyline points="480,977 480,1003" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
<polygon points="475,995 485,995 480,1003" fill="#94a3b8"/>
