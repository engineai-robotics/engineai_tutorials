<text x="170.0" y="726.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#24344a">Nav2 Goal / goal 发目标</text>
<text x="170.0" y="754.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#24344a">到点后可继续下一个目标</text>
<text x="170.0" y="782.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#24344a">中断当前任务用 cancel</text>
<rect x="356" y="658" width="248" height="150" rx="14" fill="#f5f8fc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="480.0" y="698.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#24344a">手柄控制机器人采集环境</text>
<text x="480.0" y="726.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#24344a">观察地图覆盖所需区域</text>
<text x="480.0" y="754.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#24344a">不执行自动导航步骤</text>
<text x="480.0" y="782.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#24344a">无需接通本项目运动输出</text>
<rect x="666" y="658" width="248" height="150" rx="14" fill="#f5f8fc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="790.0" y="698.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="600" fill="#24344a">确认位置和朝向</text>
<text x="790.0" y="726.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#24344a">接通输出 enable-motion</text>
<text x="790.0" y="754.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#24344a">Nav2 Goal / goal 发目标</text>
<text x="790.0" y="782.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#24344a">中断当前任务用 cancel</text>
<polyline points="170,808 170,862 480,862 480,893" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
