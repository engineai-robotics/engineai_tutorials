<text x="480.0" y="489.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#237c60">session start --mode mapping</text>
<rect x="666" y="430" width="248" height="76" rx="14" fill="#eee4fa" stroke="#b69bcf" stroke-width="1.5"/>
<text x="790.0" y="461.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#775298">saved · 旧图导航</text>
<text x="790.0" y="489.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#775298">--mode saved --map …</text>
<polyline points="170,506 170,532" fill="none" stroke="#8eadd6" stroke-width="2" stroke-linejoin="round"/>
<polygon points="165,524 175,524 170,532" fill="#8eadd6"/>
