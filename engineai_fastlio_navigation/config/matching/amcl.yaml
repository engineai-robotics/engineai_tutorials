amcl:
  ros__parameters:
    base_frame_id: navigation_base
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    map_topic: /map
    robot_model_type: nav2_amcl::OmniMotionModel
    laser_model_type: likelihood_field
    laser_min_range: 0.6
    laser_max_range: 12.0
    laser_likelihood_max_dist: 2.0
    max_beams: 90
    min_particles: 500
    max_particles: 2000
    alpha1: 0.15
    alpha2: 0.15
    alpha3: 0.15
    alpha4: 0.15
    alpha5: 0.15
    z_hit: 0.8
    z_rand: 0.2
    sigma_hit: 0.2
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    resample_interval: 1
    update_min_d: 0.05
    update_min_a: 0.05
    transform_tolerance: 0.3
    tf_broadcast: true
    set_initial_pose: false
    always_reset_initial_pose: true
    # Humble computes a period as 1/rate; zero is not a disable value.
    save_pose_rate: 0.5
