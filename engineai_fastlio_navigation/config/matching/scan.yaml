planar_scan:
  ros__parameters:
    input_topic: /pm01/obstacle_points
    output_topic: /scan
    mapping_topic: /mapping_scan
    keyframe_distance: 0.2
    keyframe_angle: 0.15
    odom_topic: /odom
    odom_frame: odom
    base_frame: base_footprint
    scan_frame: navigation_base
    beams: 720
    range_min: 0.6
    range_max: 12.0
    frequency: 5.0
    max_data_age: 0.75
    minimum_valid_beams: 12
    require_ground_status: true
    ground_status_max_age: 2.5

map_matching_adapter:
  ros__parameters:
    # Accumulate motion against spatial anchors; do not integrate sensor jitter.
    motion_resolution_m: 0.02
    motion_resolution_rad: 0.01
