{
  "bt_navigator": {
    "ros__parameters": {
      "use_sim_time": false,
      "global_frame": "map",
      "robot_base_frame": "base_footprint",
      "odom_topic": "/odom",
      "bt_loop_duration": 10,
      "default_server_timeout": 20,
      "wait_for_service_timeout": 1000
    }
  },
  "bt_navigator_navigate_through_poses_rclcpp_node": {
    "ros__parameters": {
      "use_sim_time": false
    }
  },
  "bt_navigator_navigate_to_pose_rclcpp_node": {
    "ros__parameters": {
      "use_sim_time": false
    }
  },
  "controller_server": {
    "ros__parameters": {
      "use_sim_time": false,
      "controller_frequency": 10.0,
      "min_x_velocity_threshold": 0.001,
      "min_y_velocity_threshold": 0.001,
      "min_theta_velocity_threshold": 0.001,
      "failure_tolerance": 8.0,
      "progress_checker_plugin": "progress_checker",
      "goal_checker_plugins": [
        "general_goal_checker"
      ],
      "controller_plugins": [
        "FollowPath"
      ],
      "progress_checker": {
        "plugin": "nav2_controller::SimpleProgressChecker",
        "required_movement_radius": 0.1,
        "movement_time_allowance": 30.0
      },
      "general_goal_checker": {
        "stateful": false,
        "plugin": "pm01_fastlio_nav::SettledGoalChecker",
        "xy_goal_tolerance": 0.25,
        "yaw_goal_tolerance": 0.4363323129985824,
        "trans_stopped_velocity": 0.05,
        "rot_stopped_velocity": 0.1,
        "require_stopped": false
      },
      "FollowPath": {
        "plugin": "pm01_fastlio_nav::LatestTfRotationShimController",
        "primary_controller": "pm01_fastlio_nav::SettlingDWBController",
        "angular_dist_threshold": 0.35,
        "angular_disengage_threshold": 0.2,
        "forward_sampling_distance": 0.6,
        "rotate_to_heading_angular_vel": 0.65,
        "max_angular_accel": 1.5,
        "simulate_ahead_time": 1.0,
        "rotate_to_goal_heading": false,
        "closed_loop": false,
        "debug_trajectory_details": false,
        "min_vel_x": 0.0,
        "min_vel_y": -0.4,
        "max_vel_x": 0.6,
        "max_vel_y": 0.4,
        "max_vel_theta": 0.7,
        "min_speed_xy": 0.0,
        "max_speed_xy": 0.6,
        "min_speed_theta": 0.0,
        "acc_lim_x": 2.5,
        "acc_lim_y": 1.0,
        "acc_lim_theta": 1.5,
        "decel_lim_x": -2.5,
        "decel_lim_y": -1.0,
        "decel_lim_theta": -1.5,
        "vx_samples": 20,
        "vy_samples": 5,
        "vtheta_samples": 20,
        "sim_time": 1.0,
        "linear_granularity": 0.05,
        "angular_granularity": 0.025,
        "transform_tolerance": 1.5,
        "xy_goal_tolerance": 0.25,
        "trans_stopped_velocity": 0.1,
        "short_circuit_trajectory_evaluation": true,
        "stateful": true,
        "critics": [
          "WalkingCommand",
          "RotateToGoal",
          "Oscillation",
          "BaseObstacle",
          "GoalAlign",
          "PathAlign",
          "PathDist",
          "GoalDist",
          "Twirling"
        ],
        "Oscillation.x_only_threshold": 0.5,
        "BaseObstacle.scale": 0.02,
        "PathAlign.scale": 32.0,
        "PathAlign.forward_point_distance": 0.1,
        "GoalAlign.scale": 0.0,
        "GoalAlign.forward_point_distance": 0.1,
        "PathDist.scale": 32.0,
        "GoalDist.scale": 24.0,
        "RotateToGoal.scale": 32.0,
        "RotateToGoal.slowing_factor": 5.0,
        "RotateToGoal.lookahead_time": 0.6,
        "WalkingCommand.class": "pm01_fastlio_nav::WalkingCommandCritic",
        "WalkingCommand.scale": 1.0,
        "WalkingCommand.min_linear_speed": 0.2,
        "WalkingCommand.min_angular_speed": 0.001,
        "WalkingCommand.zero_epsilon": 0.0001,
        "Twirling.scale": 5.0
      }
    }
  },
  "local_costmap": {
    "local_costmap": {
      "ros__parameters": {
        "update_frequency": 5.0,
        "publish_frequency": 2.0,
        "global_frame": "odom",
        "robot_base_frame": "base_footprint",
        "use_sim_time": false,
        "rolling_window": true,
        "width": 6,
        "height": 6,
        "resolution": 0.1,
        "robot_radius": 0.35,
        "transform_tolerance": 1.5,
        "plugins": [
          "obstacle_layer",
          "inflation_layer"
        ],
        "inflation_layer": {
          "plugin": "nav2_costmap_2d::InflationLayer",
          "cost_scaling_factor": 3.0,
          "inflation_radius": 0.8
        },
        "obstacle_layer": {
          "plugin": "nav2_costmap_2d::ObstacleLayer",
          "enabled": true,
          "min_obstacle_height": -2.0,
          "max_obstacle_height": 1.4,
          "observation_sources": "obstacles clearing",
          "obstacles": {
            "topic": "/pm01/obstacle_points",
            "max_obstacle_height": 1.4,
            "min_obstacle_height": -2.0,
            "clearing": false,
            "marking": true,
            "data_type": "PointCloud2",
            "observation_persistence": 0.0,
            "expected_update_rate": 1.0,
            "obstacle_max_range": 12.0,
            "obstacle_min_range": 0.0
          },
          "clearing": {
            "topic": "/livox/points",
            "max_obstacle_height": 1.4,
            "min_obstacle_height": -2.0,
            "clearing": true,
            "marking": false,
            "data_type": "PointCloud2",
            "raytrace_max_range": 12.0,
            "raytrace_min_range": 0.0
          }
        },
        "always_send_full_costmap": true
      }
    }
  },
  "global_costmap": {
    "global_costmap": {
      "ros__parameters": {
        "update_frequency": 2.0,
        "publish_frequency": 1.0,
        "global_frame": "map",
        "robot_base_frame": "base_footprint",
        "use_sim_time": false,
        "robot_radius": 0.35,
        "transform_tolerance": 1.5,
        "resolution": 0.1,
        "track_unknown_space": true,
        "plugins": [
          "static_layer",
          "obstacle_layer",
          "inflation_layer"
        ],
        "obstacle_layer": {
          "plugin": "nav2_costmap_2d::ObstacleLayer",
          "enabled": true,
          "min_obstacle_height": -2.0,
          "max_obstacle_height": 1.4,
          "observation_sources": "obstacles clearing",
          "obstacles": {
            "topic": "/pm01/obstacle_points",
            "max_obstacle_height": 1.4,
            "min_obstacle_height": -2.0,
            "clearing": false,
            "marking": true,
            "data_type": "PointCloud2",
            "observation_persistence": 0.0,
            "expected_update_rate": 1.0,
            "obstacle_max_range": 12.0,
            "obstacle_min_range": 0.0
          },
          "clearing": {
            "topic": "/livox/points",
            "max_obstacle_height": 1.4,
            "min_obstacle_height": -2.0,
            "clearing": true,
            "marking": false,
            "data_type": "PointCloud2",
            "raytrace_max_range": 12.0,
            "raytrace_min_range": 0.0
          }
        },
        "static_layer": {
          "plugin": "nav2_costmap_2d::StaticLayer",
          "map_topic": "/navigation_map",
          "map_subscribe_transient_local": true
        },
        "inflation_layer": {
          "plugin": "nav2_costmap_2d::InflationLayer",
          "cost_scaling_factor": 3.0,
          "inflation_radius": 0.8
        },
        "always_send_full_costmap": true
      }
    }
  },
  "map_saver": {
    "ros__parameters": {
      "save_map_timeout": 5.0,
      "free_thresh_default": 0.25,
      "occupied_thresh_default": 0.65,
      "map_subscribe_transient_local": true
    }
  },
  "planner_server": {
    "ros__parameters": {
      "use_sim_time": false,
      "expected_planner_frequency": 20.0,
      "planner_plugins": [
        "GridBased"
      ],
      "GridBased": {
        "plugin": "nav2_navfn_planner/NavfnPlanner",
        "tolerance": 0.1,
        "use_astar": false,
        "allow_unknown": false
      }
    }
  },
  "smoother_server": {
    "ros__parameters": {
      "use_sim_time": false,
      "smoother_plugins": [
        "simple_smoother"
      ],
      "simple_smoother": {
        "plugin": "nav2_smoother::SimpleSmoother",
        "tolerance": 1e-10,
        "max_its": 1000,
        "do_refinement": true
      }
    }
  },
  "behavior_server": {
    "ros__parameters": {
      "use_sim_time": false,
      "costmap_topic": "local_costmap/costmap_raw",
      "footprint_topic": "local_costmap/published_footprint",
      "cycle_frequency": 10.0,
      "behavior_plugins": [
        "spin",
        "backup",
        "drive_on_heading",
        "assisted_teleop",
        "wait"
      ],
      "spin": {
        "plugin": "nav2_behaviors/Spin"
      },
      "backup": {
        "plugin": "nav2_behaviors/BackUp"
      },
      "drive_on_heading": {
        "plugin": "nav2_behaviors/DriveOnHeading"
      },
      "wait": {
        "plugin": "nav2_behaviors/Wait"
      },
      "assisted_teleop": {
        "plugin": "nav2_behaviors/AssistedTeleop"
      },
      "global_frame": "odom",
      "robot_base_frame": "base_footprint",
      "transform_tolerance": 1.5,
      "simulate_ahead_time": 2.0,
      "max_rotational_vel": 0.7,
      "min_rotational_vel": 0.1,
      "rotational_acc_lim": 1.5
    }
  },
  "waypoint_follower": {
    "ros__parameters": {
      "use_sim_time": false,
      "loop_rate": 20,
      "stop_on_failure": false,
      "waypoint_task_executor_plugin": "wait_at_waypoint",
      "wait_at_waypoint": {
        "plugin": "nav2_waypoint_follower::WaitAtWaypoint",
        "enabled": true,
        "waypoint_pause_duration": 200
      }
    }
  },
  "velocity_smoother": {
    "ros__parameters": {
      "use_sim_time": false,
      "smoothing_frequency": 20.0,
      "scale_velocities": false,
      "feedback": "OPEN_LOOP",
      "max_velocity": [
        0.6,
        0.4,
        0.7
      ],
      "min_velocity": [
        0.0,
        -0.4,
        -0.7
      ],
      "max_accel": [
        2.5,
        1.0,
        1.5
      ],
      "max_decel": [
        -2.5,
        -1.0,
        -1.5
      ],
      "odom_topic": "/odom",
      "odom_duration": 0.1,
      "deadband_velocity": [
        0.0,
        0.0,
        0.0
      ],
      "velocity_timeout": 1.0
    }
  },
  "collision_monitor": {
    "ros__parameters": {
      "use_sim_time": false,
      "base_frame_id": "base_footprint",
      "odom_frame_id": "odom",
      "cmd_vel_in_topic": "cmd_vel_smoothed",
      "cmd_vel_out_topic": "cmd_vel",
      "state_topic": "collision_monitor_state",
      "transform_tolerance": 0.5,
      "source_timeout": 5.0,
      "base_shift_correction": true,
      "stop_pub_timeout": 2.0,
      "polygons": [
        "PolygonStop"
      ],
      "PolygonStop": {
        "type": "polygon",
        "points": "[[0.4, 0.35], [0.4, -0.35], [-0.4, -0.35], [-0.4, 0.35]]",
        "action_type": "stop",
        "min_points": 4,
        "visualize": false,
        "enabled": true
      },
      "observation_sources": [
        "pointcloud"
      ],
      "pointcloud": {
        "type": "pointcloud",
        "topic": "/livox/points",
        "min_height": 0.1,
        "max_height": 2.0,
        "enabled": true
      }
    }
  },
  "docking_server": {
    "ros__parameters": {
      "use_sim_time": false,
      "base_frame": "base_footprint",
      "fixed_frame": "odom",
      "dock_plugins": [
        "simple_charging_dock"
      ],
      "simple_charging_dock": {
        "plugin": "opennav_docking::SimpleChargingDock",
        "use_battery_status": false,
        "use_stall_detection": false
      }
    }
  },
  "navigation_command_gate": {
    "ros__parameters": {
      "use_sim_time": false,
      "heartbeat_timeout": 2.5,
      "observation_timeout": 0.75,
      "map_observation_timeout": 2.5,
      "resume_delay": 1.0
    }
  }
}
