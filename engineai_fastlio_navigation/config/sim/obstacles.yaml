{
  "navigation_obstacle_cloud": {
    "ros__parameters": {
      "input_topic": "/pm01/deskewed_points",
      "output_topic": "/pm01/obstacle_points",
      "reference_frame": "odom",
      "obstacle_height": 0.025,
      "max_height": 1.8,
      "max_range": 12.0,
      "frequency": 5.0,
      "max_data_age": 0.75,
      "near_ground_filter": true,
      "near_ground_band_max": 0.06,
      "near_ground_support_radius": 0.2,
      "use_shared_ground": true,
      "ground_model_topic": "/pm01/ground_plane_status"
    }
  }
}
