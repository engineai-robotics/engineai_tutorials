{
  "online_navigation_map": {
    "ros__parameters": {
      "enabled": true,
      "seed_topic": "/map",
      "output_topic": "/navigation_map",
      "cloud_topic": "/pm01/deskewed_points",
      "min_sensor_height": 0.7,
      "max_sensor_height": 1.5,
      "obstacle_height": 0.025,
      "adaptive_ground": true,
      "max_height": 1.8,
      "max_range": 12.0,
      "update_frequency": 2.0,
      "max_data_age": 0.75,
      "height_resolution": 0.05,
      "ray_clearance": 0.15,
      "near_ground_filter": true,
      "near_ground_band_max": 0.06,
      "near_ground_support_radius": 0.2,
      "fresh_map": false,
      "map_resolution": 0.1,
      "initial_map_size_m": 30.0,
      "map_growth_step_m": 5.0,
      "max_map_cells": 1000000,
      "use_shared_ground": true,
      "ground_model_topic": "/pm01/ground_plane_status"
    }
  }
}
