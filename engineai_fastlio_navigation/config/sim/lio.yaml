# Gazebo scan timing and URDF mounting; estimator settings match hardware.
/**:
  ros__parameters:
    common:
      concurrent_sensor_io: true
      lidar_qos_best_effort: true
      lidar_is_snapshot: true
      imu_queue_size: 200
    mapping:
      extrinsic_est_en: false
      initial_rpy: [0.8726646259971648, 0.0, 1.5707963267948966]
      initial_xyz: [0.08777223573999118, 0.011, 0.2832761857408709]
    publish:
      map_en: false
      dense_publish_en: true
    pcd_save:
      pcd_save_en: false
